<title>ProThroCalcu</title>
<style>
  :root{
    --bg:#eef0f3;
    --surface:#ffffff;
    --surface-2:#f5f6f8;
    --line:#d7dbe1;
    --text:#12151a;
    --text-dim:#5b6270;
    --accent:#0a7ea8;
    --accent-2:#c8600a;
    --accent-contrast:#ffffff;
    --shadow: 0 1px 2px rgba(20,24,30,.04), 0 8px 24px rgba(20,24,30,.06);
    --beam: rgba(10,126,168,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d10;
      --surface:#141821;
      --surface-2:#1a1f2a;
      --line:#2a3040;
      --text:#e9ecf2;
      --text-dim:#8a92a4;
      --accent:#3fd0ff;
      --accent-2:#ff9a3d;
      --accent-contrast:#04141c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
      --beam: rgba(63,208,255,.10);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d10;
    --surface:#141821;
    --surface-2:#1a1f2a;
    --line:#2a3040;
    --text:#e9ecf2;
    --text-dim:#8a92a4;
    --accent:#3fd0ff;
    --accent-2:#ff9a3d;
    --accent-contrast:#04141c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    --beam: rgba(63,208,255,.10);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:32px 16px calc(48px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{ max-width:720px; margin:0 auto; }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .mark{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 5px var(--beam);
    flex:none;
  }
  .brand .tag{
    font-size:12.5px;
    color:var(--text-dim);
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:600;
  }

  .controls{ display:flex; gap:8px; align-items:center; }
  .segmented{
    display:flex;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:3px;
    box-shadow:var(--shadow);
  }
  .segmented button{
    appearance:none; border:none; background:transparent;
    color:var(--text-dim);
    font-family:inherit; font-weight:700; font-size:12.5px;
    letter-spacing:.03em;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .segmented button[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-contrast);
  }
  .segmented button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .iconbtn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .iconbtn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .iconbtn svg{ width:18px; height:18px; }

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Space Grotesk',monospace;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin:0 0 14px 0;
    color:var(--text-dim);
    font-weight:700;
  }

  /* ---------- search / lookup ---------- */
  .lookup-row{ display:flex; gap:10px; }
  .lookup-row input[type="text"]{
    flex:1;
    min-width:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
  }
  .lookup-row input[type="text"]::placeholder{ color:var(--text-dim); }
  .lookup-row input[type="text"]:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .lookup-row button{
    appearance:none; border:none;
    background:var(--accent);
    color:var(--accent-contrast);
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.02em;
    border-radius:10px;
    padding:0 18px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .lookup-row button:disabled{ opacity:.55; cursor:default; }
  .lookup-row button:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; }

  .lookup-result{
    margin-top:14px;
    font-size:14px;
    line-height:1.55;
    color:var(--text);
    min-height:0;
  }
  .lookup-result.empty{ display:none; }
  .lookup-result .note{
    display:block;
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
  }
  .lookup-result .err{ color:var(--accent-2); }
  .spinner{
    display:inline-block;
    width:13px; height:13px;
    border-radius:50%;
    border:2px solid var(--accent-contrast);
    border-top-color:transparent;
    animation:spin .7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- inputs ---------- */
  .field{ margin-bottom:18px; }
  .field:last-child{ margin-bottom:0; }
  .field-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px;
    gap:10px;
  }
  .field-head label{
    font-size:13px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-dim);
  }
  .ratio-input-group{
    display:flex; align-items:center; gap:8px;
  }
  .ratio-input-group input[type="number"]{
    width:84px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-variant-numeric: tabular-nums;
    text-align:right;
  }
  .ratio-input-group input[type="number"]:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .ratio-input-group span{ color:var(--text-dim); font-size:13px; }

  input[type="range"]{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:99px;
    background:linear-gradient(90deg,var(--accent) 0%, var(--accent) var(--fill,50%), var(--line) var(--fill,50%), var(--line) 100%);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--surface);
    border:3px solid var(--accent);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px;
    border-radius:50%;
    background:var(--surface);
    border:3px solid var(--accent);
    cursor:pointer;
  }
  input[type="range"]:focus-visible::-webkit-slider-thumb{ outline:2px solid var(--accent-2); outline-offset:2px; }

  .dist-readout{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-variant-numeric: tabular-nums;
    color:var(--accent);
    font-weight:700;
  }
  .range-ticks{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-dim);
    margin-top:6px;
    font-family:'JetBrains Mono',monospace;
  }

  /* ---------- diagram ---------- */
  .diagram-wrap{ margin:4px 0 4px; }
  svg.diagram{ width:100%; height:auto; display:block; overflow:visible; }
  .diagram text{ font-family:'JetBrains Mono',monospace; }

  /* ---------- results ---------- */
  .results{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  @media (max-width:420px){
    .results{ grid-template-columns:1fr; }
  }
  .result-tile{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .result-tile.accent{
    border-color:var(--accent);
    background:var(--beam);
  }
  .result-tile .k{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--text-dim);
    font-weight:700;
  }
  .result-tile .v{
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    line-height:1.15;
    word-break:break-word;
  }
  .result-tile .v small{ font-size:13px; color:var(--text-dim); font-weight:500; }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:28px;
    line-height:1.6;
  }
</style>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark"><span class="dot" aria-hidden="true"></span>PROTHROCALCU</div>
      <div class="tag">throw ratio → screen size</div>
    </div>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Units">
        <button type="button" id="unit-m" aria-pressed="true">M</button>
        <button type="button" id="unit-ft" aria-pressed="false">FT</button>
      </div>
      <button class="iconbtn" id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </header>

  <section class="card" aria-labelledby="lookup-h">
    <h2 id="lookup-h">Find a projector's throw ratio</h2>
    <div class="lookup-row">
      <input type="text" id="lookup-input" placeholder="e.g. Epson EB-2247U" autocomplete="off">
      <button type="button" id="lookup-btn">Look up</button>
    </div>
    <div class="lookup-result empty" id="lookup-result" aria-live="polite"></div>
  </section>

  <section class="card" aria-labelledby="calc-h">
    <h2 id="calc-h">Calculator</h2>

    <div class="field">
      <div class="field-head">
        <label for="ratio">Throw ratio</label>
        <div class="ratio-input-group">
          <input type="number" id="ratio" value="1.50" min="0.15" max="6" step="0.01">
          <span>: 1</span>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="field-head">
        <label for="distance">Throw distance</label>
        <span class="dist-readout" id="distance-readout">3.00 m</span>
      </div>
      <input type="range" id="distance" min="0" max="10" step="0.01" value="3">
      <div class="range-ticks"><span>0 m</span><span>2.5 m</span><span>5 m</span><span>7.5 m</span><span>10 m</span></div>
    </div>

    <div class="diagram-wrap">
      <svg class="diagram" id="diagram" viewBox="0 0 640 220" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-desc">
        <desc id="diagram-desc">Side view of the projector beam from the lens to the screen, scaled to the current throw distance and screen width.</desc>
      </svg>
    </div>

    <div class="results">
      <div class="result-tile">
        <div class="k">Width</div>
        <div class="v" id="out-width">—</div>
      </div>
      <div class="result-tile">
        <div class="k">Height</div>
        <div class="v" id="out-height">—</div>
      </div>
      <div class="result-tile accent">
        <div class="k">Corner‑to‑corner</div>
        <div class="v" id="out-diag">—</div>
      </div>
    </div>
  </section>

  <footer>Assumes a 16:9 screen. Throw ratio = throw distance ÷ image width.</footer>
</div>

<script>
(function(){
  "use strict";

  var M_TO_FT = 3.280839895;

  var state = { unit: 'm', theme: 'system' };

  // ---------- theme ----------
  var themeBtn = document.getElementById('theme-toggle');
  var sunIcon = document.getElementById('theme-icon-sun');
  var moonIcon = document.getElementById('theme-icon-moon');

  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyThemeIcon(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (document.documentElement.getAttribute('data-theme') !== 'light' && systemPrefersDark());
    sunIcon.style.display = dark ? 'none' : '';
    moonIcon.style.display = dark ? '' : 'none';
    themeBtn.setAttribute('aria-pressed', String(dark));
  }
  themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var currentlyDark = current === 'dark' || (!current && systemPrefersDark());
    var next = currentlyDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('prothrocalcu-theme', next); }catch(e){}
    applyThemeIcon();
    drawDiagram();
  });
  try{
    var savedTheme = localStorage.getItem('prothrocalcu-theme');
    if(savedTheme === 'dark' || savedTheme === 'light'){
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  }catch(e){}
  applyThemeIcon();

  // ---------- unit toggle ----------
  var unitMBtn = document.getElementById('unit-m');
  var unitFtBtn = document.getElementById('unit-ft');
  function setUnit(u){
    state.unit = u;
    unitMBtn.setAttribute('aria-pressed', String(u === 'm'));
    unitFtBtn.setAttribute('aria-pressed', String(u === 'ft'));
    try{ localStorage.setItem('prothrocalcu-unit', u); }catch(e){}
    updateAll();
  }
  unitMBtn.addEventListener('click', function(){ setUnit('m'); });
  unitFtBtn.addEventListener('click', function(){ setUnit('ft'); });
  try{
    var savedUnit = localStorage.getItem('prothrocalcu-unit');
    if(savedUnit === 'm' || savedUnit === 'ft') state.unit = savedUnit;
  }catch(e){}
  unitMBtn.setAttribute('aria-pressed', String(state.unit === 'm'));
  unitFtBtn.setAttribute('aria-pressed', String(state.unit === 'ft'));

  // ---------- calculator elements ----------
  var ratioInput = document.getElementById('ratio');
  var distanceInput = document.getElementById('distance');
  var distanceReadout = document.getElementById('distance-readout');
  var outWidth = document.getElementById('out-width');
  var outHeight = document.getElementById('out-height');
  var outDiag = document.getElementById('out-diag');

  function fmtLength(meters){
    if(state.unit === 'ft'){
      var totalFt = meters * M_TO_FT;
      var ft = Math.floor(totalFt);
      var inches = Math.round((totalFt - ft) * 12);
      if(inches === 12){ ft += 1; inches = 0; }
      return ft + "' " + inches + '"';
    }
    return meters.toFixed(2) + ' m';
  }
  function fmtDistance(meters){
    if(state.unit === 'ft') return (meters * M_TO_FT).toFixed(2) + ' ft';
    return meters.toFixed(2) + ' m';
  }

  function currentValues(){
    var ratio = parseFloat(ratioInput.value);
    var distance = parseFloat(distanceInput.value);
    if(!isFinite(ratio) || ratio <= 0) ratio = 0.01;
    if(!isFinite(distance) || distance < 0) distance = 0;
    var width = distance / ratio;
    var height = width * 9 / 16;
    var diag = Math.sqrt(width * width + height * height);
    return { ratio: ratio, distance: distance, width: width, height: height, diag: diag };
  }

  function updateFillVar(){
    var min = parseFloat(distanceInput.min), max = parseFloat(distanceInput.max);
    var pct = ((parseFloat(distanceInput.value) - min) / (max - min)) * 100;
    distanceInput.style.setProperty('--fill', pct + '%');
  }

  function readCssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function drawDiagram(){
    var v = currentValues();
    var svg = document.getElementById('diagram');
    var W = 640, H = 220;
    var padL = 30, padR = 30, padT = 24, padB = 34;
    var maxDistPx = W - padL - padR;
    var maxDist = 10; // matches slider max, in meters
    var distPx = Math.max(4, (v.distance / maxDist) * maxDistPx);
    var lensX = padL, lensY = H - padB;
    var screenX = padL + distPx;

    // scale screen height representation (not literal, just proportional & bounded)
    var maxScreenPx = H - padT - padB;
    var screenHalfPx = Math.min(maxScreenPx / 2, Math.max(10, v.height * 14));

    var accent = readCssVar('--accent') || '#0a7ea8';
    var text = readCssVar('--text') || '#12151a';
    var textDim = readCssVar('--text-dim') || '#5b6270';
    var line = readCssVar('--line') || '#d7dbe1';
    var accent2 = readCssVar('--accent-2') || '#c8600a';

    var svgns = 'http://www.w3.org/2000/svg';
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var desc = document.createElementNS(svgns,'desc');
    desc.textContent = 'Side view of the projector beam from the lens to the screen, scaled to the current throw distance and screen width.';
    svg.appendChild(desc);

    function el(tag, attrs){
      var e = document.createElementNS(svgns, tag);
      for(var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // baseline
    svg.appendChild(el('line', {x1:padL-10, y1:lensY, x2:W-padR+10, y2:lensY, stroke:line, 'stroke-width':1, 'stroke-dasharray':'3,4'}));

    // beam (triangle from lens to screen extents)
    var beamPath = 'M ' + lensX + ' ' + lensY + ' L ' + screenX + ' ' + (lensY - screenHalfPx) + ' L ' + screenX + ' ' + (lensY + screenHalfPx) + ' Z';
    svg.appendChild(el('path', {d:beamPath, fill:accent, 'fill-opacity':'0.12', stroke:accent, 'stroke-width':1.2}));

    // projector body (small rect at lens)
    svg.appendChild(el('rect', {x:lensX-16, y:lensY-9, width:20, height:18, rx:3, fill:text, 'fill-opacity':'0.85'}));
    svg.appendChild(el('circle', {cx:lensX+4, cy:lensY, r:4.5, fill:accent}));

    // screen (vertical bar)
    svg.appendChild(el('line', {x1:screenX, y1:lensY-screenHalfPx, x2:screenX, y2:lensY+screenHalfPx, stroke:accent2, 'stroke-width':4, 'stroke-linecap':'round'}));

    // distance dimension line above
    var dimY = padT + 6;
    svg.appendChild(el('line', {x1:lensX, y1:dimY, x2:screenX, y2:dimY, stroke:textDim, 'stroke-width':1}));
    svg.appendChild(el('line', {x1:lensX, y1:dimY-5, x2:lensX, y2:dimY+5, stroke:textDim, 'stroke-width':1}));
    svg.appendChild(el('line', {x1:screenX, y1:dimY-5, x2:screenX, y2:dimY+5, stroke:textDim, 'stroke-width':1}));
    var distLabel = el('text', {x:(lensX+screenX)/2, y:dimY-9, 'text-anchor':'middle', 'font-size':'12', fill:textDim});
    distLabel.textContent = fmtDistance(v.distance) + ' throw';
    svg.appendChild(distLabel);

    // width label near screen
    var widthLabel = el('text', {x:screenX+10, y:lensY+screenHalfPx+16, 'text-anchor':'start', 'font-size':'12', fill:accent2, 'font-weight':'700'});
    widthLabel.textContent = fmtLength(v.width) + ' wide';
    if(screenX + 130 > W){ widthLabel.setAttribute('text-anchor','end'); widthLabel.setAttribute('x', screenX-10); }
    svg.appendChild(widthLabel);

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  }

  function updateAll(){
    var v = currentValues();
    distanceReadout.textContent = fmtDistance(v.distance);
    outWidth.innerHTML = fmtLength(v.width);
    outHeight.innerHTML = fmtLength(v.height);
    outDiag.innerHTML = fmtLength(v.diag);
    updateFillVar();
    drawDiagram();
  }

  ratioInput.addEventListener('input', updateAll);
  distanceInput.addEventListener('input', updateAll);
  window.addEventListener('resize', drawDiagram);

  updateAll();

  // ---------- lookup via Claude (sample capability) ----------
  var lookupInput = document.getElementById('lookup-input');
  var lookupBtn = document.getElementById('lookup-btn');
  var lookupResult = document.getElementById('lookup-result');
  var sampleFn = null;
  var sampleReady = false;

  function showLookupIdle(){
    lookupBtn.disabled = false;
    lookupBtn.textContent = 'Look up';
  }

  function renderLookup(html){
    lookupResult.classList.remove('empty');
    lookupResult.innerHTML = html;
  }

  async function initSample(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        sampleFn = await window.claude.use('sample');
      }
    }catch(e){ sampleFn = null; }
    sampleReady = true;
  }
  initSample();

  async function doLookup(){
    var name = (lookupInput.value || '').trim();
    if(!name) return;

    if(!sampleReady){
      await initSample();
    }
    if(!sampleFn){
      renderLookup('<span class="err">Lookup isn\'t available in this view.</span><span class="note">Open this page on claude.ai to use the lookup — or enter the throw ratio from the projector\'s manual below.</span>');
      return;
    }

    lookupBtn.disabled = true;
    lookupBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Looking up…';
    renderLookup('<em>Checking&hellip;</em>');

    var prompt = 'You are looking up a projector\'s throw ratio for a throw-distance calculator. ' +
      'Projector: "' + name + '". ' +
      'From what you know, give its throw ratio (distance ÷ image width) as a single value or range, ' +
      'e.g. "1.39–2.09:1" or "1.5:1". If it has a zoom lens, give the full zoom range. ' +
      'If you are not confident this is a real, specific projector model, say so plainly instead of guessing. ' +
      'Reply in at most two short sentences, plain text, no markdown.';

    try{
      var res = await sampleFn(prompt, { modelTier: 'quick', cache: true });
      var safeName = name.replace(/</g,'&lt;');
      var safeText = (res.text || '').replace(/</g,'&lt;');
      renderLookup(
        '<strong>' + safeName + '</strong> — ' + safeText +
        '<span class="note">From Claude\'s general knowledge, not a live spec lookup — this value is not entered into the calculator automatically. Confirm against the manufacturer\'s datasheet before you rely on it.</span>'
      );
    }catch(e){
      var code = (e && e.code) || 'unknown';
      var msg;
      switch(code){
        case 'not_granted':
          msg = 'Lookup needs your permission to ask Claude from this page — try again and allow it, or enter the ratio manually.';
          break;
        case 'rate_limited':
          msg = 'Too many lookups right now — wait a moment and try again.';
          break;
        case 'cancelled':
          msg = '';
          break;
        default:
          msg = 'Couldn\'t complete the lookup. Try again, or enter the throw ratio from the projector\'s manual below.';
      }
      if(msg) renderLookup('<span class="err">' + msg + '</span>');
      else lookupResult.classList.add('empty');
    }finally{
      showLookupIdle();
    }
  }

  lookupBtn.addEventListener('click', doLookup);
  lookupInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); doLookup(); }
  });

})();
</script>
